name: Deploy backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
          cache: maven

      - name: Run tests
        run: bash mvnw test

      - name: Run importer tests
        run: python3 -m unittest discover -s tools -p test_import_sqlite.py

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" '
            set -e
            cd ~/metin2-market-api
            git config core.fileMode false
            git checkout -- mvnw 2>/dev/null || true
            dirty_checkout="$(git status --porcelain)"
            if [ -n "$dirty_checkout" ]; then
              echo "Production checkout has local files:"
              git status --short
              git diff --stat
              if [ "$dirty_checkout" = "?? curl" ] && [ -f curl ] && [ ! -L curl ]; then
                preserve_root="$HOME/metin-market-api-checkout-backups"
                mkdir -p "$preserve_root"
                chmod 700 "$preserve_root"
                preserve_dir="$(mktemp -d "$preserve_root/curl-$(date -u +%Y%m%dT%H%M%SZ)-XXXXXX")"
                chmod 700 "$preserve_dir"
                stat -c "Preserving curl: type=%F size=%s mode=%a" -- curl
                mv -- curl "$preserve_dir/curl"
                echo "Preserved untracked file outside the checkout: $preserve_dir/curl"
              else
                echo "Refusing to overwrite unexpected local production files"
                exit 1
              fi
            fi
            if [ -n "$(git status --porcelain)" ]; then
              echo "Refusing to deploy; local files remain in the checkout"
              git status --short
              git diff --stat
              exit 1
            fi
            git fetch origin main
            git reset --hard origin/main
            sudo docker compose up -d --build api
            sudo caddy validate --config ops/Caddyfile --adapter caddyfile
            sudo cp ops/Caddyfile /etc/caddy/Caddyfile
            sudo systemctl reload caddy
          '

      - name: Health check
        run: |
          for i in {1..12}; do
            if curl --fail --silent --show-error \
              "https://api.mazikox.pl/api/v1/items?page=0&size=1" > /dev/null \
              && curl --fail --silent --show-error \
              "https://api.mazikox.pl/api/v1/items/suggestions?query=Miecz" > /dev/null \
              && curl --fail --silent --show-error \
              "https://api.mazikox.pl/api/v1/items/statistics?vnum=180" > /dev/null \
              && curl --fail --silent --show-error \
              "https://api.mazikox.pl/api/v1/servers/pandora/items?page=0&size=1" > /dev/null \
              && curl --fail --silent --show-error \
              "https://api.mazikox.pl/api/v1/servers/pandora/items/suggestions?query=Miecz" > /dev/null \
              && curl --fail --silent --show-error \
              "https://api.mazikox.pl/api/v1/servers/pandora/items/statistics?vnum=180" > /dev/null \
              && curl --fail --silent --show-error \
              "https://api.mazikox.pl/api/v1/servers/elder/items?page=0&size=1" > /dev/null \
              && curl --fail --silent --show-error \
              "https://api.mazikox.pl/api/v1/servers/elder/items/suggestions?query=Miecz" > /dev/null \
              && curl --fail --silent --show-error \
              "https://api.mazikox.pl/api/v1/servers/elder/items/statistics?vnum=180" > /dev/null \
              && curl --fail --silent --show-error \
              "https://api.mazikox.pl/api/v1/servers/beavium/items?page=0&size=1" > /dev/null \
              && curl --fail --silent --show-error \
              "https://api.mazikox.pl/api/v1/servers/beavium/items/suggestions?query=Miecz" > /dev/null \
              && curl --fail --silent --show-error \
              "https://api.mazikox.pl/api/v1/servers/beavium/items/statistics?vnum=180" > /dev/null; then
              echo "API healthy"
              exit 0
            fi

            sleep 5
          done

          echo "API health check failed after 12 attempts"
          exit 1

      - name: Import Beavium item catalog
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" '
            set -e
            cd ~/metin2-market-api
            bash ops/import-beavium-catalog.sh
          '

      - name: Verify Caddy routing smoke test
        run: |
          for path in "" "?server=pandora" "?server=elder" "?server=beavium" "?server=unknown" "?server=pandora&server=elder" "?server=elder&server=pandora" "?server=unknown&server=pandora" "?server=&server=elder" "?server=beavium&server=unknown"; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://metin2bazar.pl/$path")
            if [ "$status" != "200" ]; then
              echo "Expected HTTP 200 for https://metin2bazar.pl/$path, got $status"
              exit 1
            fi
          done
          for path in "elder" "beavium"; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://metin2bazar.pl/$path")
            if [ "$status" != "404" ]; then
              echo "Expected HTTP 404 for https://metin2bazar.pl/$path, got $status"
              exit 1
            fi
          done
          echo "Caddy routing smoke test passed"

