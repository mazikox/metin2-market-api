name: VPS Post-Deploy Verification

on:
  push:
    branches:
      - security-hardening
  workflow_dispatch:

jobs:
  verify-post-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Run Verification Commands
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" '
            echo "==================== 1. sudo ss -tulpn ===================="
            sudo ss -tulpn

            echo "==================== 2. docker ps ===================="
            sudo docker ps

            echo "==================== 3. docker compose ps w /home/debian/metin2-market-api ===================="
            cd /home/debian/metin2-market-api && sudo docker compose ps

            echo "==================== 4. curl -I https://api.mazikox.pl/api/v1/items?page=0&size=1 ===================="
            curl -I "https://api.mazikox.pl/api/v1/items?page=0&size=1"

            echo "==================== 5. curl -I http://127.0.0.1:8080/api/v1/items?page=0&size=1 ===================="
            curl -I "http://127.0.0.1:8080/api/v1/items?page=0&size=1"
          ' > post_deploy_verification.txt

      - name: Save Result to Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B vps-audit-data
          git add post_deploy_verification.txt
          git commit -m "chore: save post deploy verification"
          git push --force origin vps-audit-data
