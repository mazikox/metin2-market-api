name: VPS Security Audit

on:
  push:
    branches:
      - security-hardening
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Check .env variables presence (NO VALUES)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" '
            ENV_FILE="/home/debian/metin2-market-api/.env"
            if [ -f "$ENV_FILE" ]; then
              if sudo grep -qE "^POSTGRES_PASSWORD=" "$ENV_FILE"; then
                echo "POSTGRES_PASSWORD: PRESENT"
              else
                echo "POSTGRES_PASSWORD: MISSING"
              fi

              if sudo grep -qE "^SCANNER_TOKEN=" "$ENV_FILE"; then
                echo "SCANNER_TOKEN: PRESENT"
              else
                echo "SCANNER_TOKEN: MISSING"
              fi
            else
              echo "POSTGRES_PASSWORD: MISSING"
              echo "SCANNER_TOKEN: MISSING"
            fi
          ' > env_check_result.txt

      - name: Save Result to Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B vps-audit-data
          git add env_check_result.txt
          git commit -m "chore: check env presence"
          git push --force origin vps-audit-data
