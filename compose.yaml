services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: metin_market
      POSTGRES_USER: metin_market
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - metin-market-postgres-v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metin_market -d metin_market"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      ANALYTICS_ENABLED: "true"
      ANALYTICS_SECRET: ${ANALYTICS_SECRET:?ANALYTICS_SECRET is required}
      ANALYTICS_PROXY_TOKEN: ${ANALYTICS_PROXY_TOKEN:?ANALYTICS_PROXY_TOKEN is required}
      DATABASE_URL: jdbc:postgresql://postgres:5432/metin_market
      DATABASE_USERNAME: metin_market
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://metin2bazar.pl,https://www.metin2bazar.pl,https://mazikox.pl,https://*.mazikox.pl,http://localhost:5173}
      SCANNER_TOKEN: ${SCANNER_TOKEN:?SCANNER_TOKEN is required}
      SCANNER_TOKEN_ELDER: ${SCANNER_TOKEN_ELDER:?SCANNER_TOKEN_ELDER is required}
      SCANNER_TOKEN_BEAVIUM: ${SCANNER_TOKEN_BEAVIUM:?SCANNER_TOKEN_BEAVIUM is required}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  metin-market-postgres-v18:
