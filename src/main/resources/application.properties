spring.application.name=metin-market-api
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/metin_market}
spring.datasource.username=${DATABASE_USERNAME:metin_market}
spring.datasource.password=${DATABASE_PASSWORD:metin_market}
spring.flyway.enabled=false
spring.sql.init.mode=never
app.scanner-token.pandora=${SCANNER_TOKEN}
app.scanner-token.elder=${SCANNER_TOKEN_ELDER}
app.scanner-token.beavium=${SCANNER_TOKEN_BEAVIUM}
app.database.pool.maximum-size=${DATABASE_POOL_MAXIMUM_SIZE:4}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://metin2bazar.pl,https://www.metin2bazar.pl,https://mazikox.pl,https://*.mazikox.pl,http://localhost:5173}
server.error.include-message=never

# Caddy supplies authenticated proxy metadata; never use arbitrary forwarded headers.
server.forward-headers-strategy=none
app.analytics.enabled=${ANALYTICS_ENABLED:false}
app.analytics.secret=${ANALYTICS_SECRET:}
app.analytics.proxy-token=${ANALYTICS_PROXY_TOKEN:}
